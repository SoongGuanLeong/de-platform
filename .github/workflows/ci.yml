name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# contents: read everywhere; the only job that elevates is images, which needs
# packages: write to push to GHCR (docs/ci-cd-strategy.md section 3).
permissions:
  contents: read

concurrency:
  group: ci-${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  # The path filter map. It runs first, always, and its outputs drive every
  # path-filtered job (docs/ci-cd-strategy.md sections 3 and 5).
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unit_any: ${{steps.filter.outputs.unit_any}}
      unit_matrix: ${{steps.filter.outputs.unit_matrix}}
      java: ${{steps.filter.outputs.java}}
      deployment: ${{steps.filter.outputs.deployment}}
      observability: ${{steps.filter.outputs.observability}}
      images: ${{steps.filter.outputs.images}}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # The filter map is proven load-bearing before it is used: the real
      # paths.sh runs against a throwaway repository and each job's selection is
      # asserted, so a filter that would skip a check it invalidates fails here.
      - name: Prove the path filters select the right jobs
        run: bash deployment/scripts/test-paths.sh
      - name: Compute path filters
        id: filter
        env:
          # On a push the base is the commit before the push, so every commit in
          # the push is judged; on a pull request it is the PR base SHA.
          BASE_SHA: ${{github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha}}
        run: |
          set -euo pipefail
          bash deployment/scripts/paths.sh "${BASE_SHA}" >> "${GITHUB_OUTPUT}"

  # Absorbs .github/workflows/security.yml; that file is deleted in the same
  # change, so one required check covers the whole graph.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan for secrets
        run: bash deployment/scripts/check-secrets.sh

  # ruff, the packaging graph, import-linter rules 1 to 4, and rule 5.
  boundaries:
    name: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned uv
        run: bash deployment/scripts/install-uv.sh
      - name: Check boundaries
        run: bash deployment/scripts/check-boundaries.sh
      # Proves the boundary contracts are load-bearing: a deliberate cross-path
      # import must fail lint-imports (the ticket's fourth acceptance criterion).
      - name: Prove a cross-path import fails
        run: bash deployment/scripts/test-check-boundaries.sh
      # Proves the YAML single-entry-point check is load-bearing: a safe_load call
      # in a .py file and one in a .sh file must each fail it.
      - name: Prove the YAML single-entry-point check catches a mutation
        run: bash deployment/scripts/test-check-yaml-loading.sh
      # Proves the catalog-API boundary check is load-bearing: a Management API
      # path in the shared core must fail it.
      - name: Prove the catalog-API boundary check catches a mutation
        run: bash deployment/scripts/test-check-catalog-api.sh

  # The completion-bar register and budget validator, which landed with issue #32;
  # the contract validator and breaking-change check land with issues #36 and
  # #43, and the cross-path and layout-agreement checks with later phases.
  governance:
    name: governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, because the validator resolves a cited budget to the commit
      # that declared it, which is what makes the threshold-before-measurement
      # order visible (docs/completion-bar.md section 9).
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install pinned uv
        run: bash deployment/scripts/install-uv.sh
      - name: Check governance
        run: bash deployment/scripts/check-governance.sh
      # Proves the validator is load-bearing: eleven mutations must each fail it,
      # and a valid evidence item citing a committed budget must pass.
      - name: Prove the register validator catches a mutation
        run: bash deployment/scripts/test-check-governance.sh

  # The compose-subset lint, the limit resolution, the profile-peak recompute and
  # the image pins (docs/completion-bar.md sections 11 and 12, issue #31).
  compose:
    name: compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned uv
        run: bash deployment/scripts/install-uv.sh
      - name: Check the compose subset
        run: bash deployment/scripts/check-compose.sh
      # Proves the lint is load-bearing: nine mutations must each fail it.
      - name: Prove the compose lint catches a mutation
        run: bash deployment/scripts/test-check-compose.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned uv
        run: bash deployment/scripts/install-uv.sh
      - name: Lint
        run: bash deployment/scripts/check-lint.sh

  # The per-distribution unit tests. The matrix is the changed distributions, so
  # a change to one path does not pay for the other four; a change to platform/
  # or contracts/ runs all five (docs/ci-cd-strategy.md section 5).
  unit:
    name: unit (${{matrix.distribution}})
    needs: changes
    if: needs.changes.outputs.unit_any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        distribution: ${{fromJSON(needs.changes.outputs.unit_matrix)}}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned uv
        run: bash deployment/scripts/install-uv.sh
      - name: Run unit tests
        run: bash deployment/scripts/run-unit-tests.sh "${{matrix.distribution}}"

  # The Flink jobs: the streaming distributions' unit tests under Flink's test
  # harness. The Gradle project and its committed wrapper landed with issue #38.
  java:
    name: java
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@6a0805fcefea3d4657a47ac4c165951e33482018 # v4.2.2
        with:
          distribution: temurin
          java-version: '17'
      - name: Run the Flink job tests
        run: bash deployment/scripts/run-java-tests.sh

  # OpenTofu, Helm and the policy scan. The modules land with issue #74.
  deployment:
    name: deployment
    needs: changes
    if: needs.changes.outputs.deployment == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check the deployment artefacts
        run: |
          set -euo pipefail
          bash deployment/scripts/check-stub.sh deployment 74 \
            deployment \( -name '*.tf' -o -name '*.tfvars' -o -name 'Chart.yaml' \) -print -quit

  # The Prometheus rules and the dashboards. They land with issue #67.
  observability:
    name: observability
    needs: changes
    if: needs.changes.outputs.observability == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check the observability artefacts
        run: |
          set -euo pipefail
          bash deployment/scripts/check-stub.sh observability 67 \
            observability \( -name '*.yml' -o -name '*.yaml' -o -name '*.json' \) -print -quit

  # The one built image. The build lands with issue #75.
  images:
    name: images
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the image
        run: |
          set -euo pipefail
          bash deployment/scripts/check-stub.sh images 75 \
            deployment \( -name 'Dockerfile' -o -name 'Dockerfile.*' -o -name '*.Dockerfile' \) -print -quit

  # The only status check the ruleset requires. It fails on any failure or
  # cancellation and passes on success or skipped, so a legitimately
  # path-filtered job cannot block a merge (docs/ci-cd-strategy.md section 3).
  required:
    name: required
    needs: [changes, secrets, boundaries, governance, compose, lint, unit, java, deployment, observability, images]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::a required job failed or was cancelled"
          exit 1
      - name: Pass
        run: echo "every required job succeeded or was skipped"
