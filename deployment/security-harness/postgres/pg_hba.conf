# Security evidence harness: host connections must use TLS.
#
# ADR-0029 puts TLS on PostgreSQL because hostssl makes it enforcement rather
# than availability. A non-TLS host connection is refused here, not merely
# unprotected, so the negative test can prove a refusal.

local   all             all                                     trust
hostssl all             all             127.0.0.1/32            scram-sha-256
hostssl all             all             ::1/128                 scram-sha-256
hostnossl all           all             all                     reject
