[project]
name = "ingestion"
version = "0.0.0"
description = "Ingestion for both spines: the Debezium connector, the OLTP DDL and load, the RIPE Atlas collector and the ONSPD loader."
requires-python = ">=3.12"
dependencies = ["platform"]

[tool.uv.sources]
platform = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

# The import package carries the "de_" prefix because the repository root is a
# valid sys.path entry, and a top-level package named "ingestion" would be
# shadowed by the "ingestion/" distribution directory beside it. The prefix
# applies uniformly to every distribution in the workspace.
[tool.uv.build-backend]
module-name = "de_ingestion"
