# Pinned tool versions for de-platform, sourced by deployment/scripts/*.sh and
# by .github/workflows/ci.yml. It is shell-sourceable on purpose: the checks are
# shell, and a script fetches its pinned tool by version plus SHA256 and verifies
# the digest before use (docs/ci-cd-strategy.md section 9).
#
# Python tool versions (ruff, import-linter, pytest, yamllint, actionlint-py) are
# pinned by uv.lock instead, because uv resolves them; this file holds the tools
# uv does not manage. Container image digests are appended here by issue #31.

UV_VERSION="0.12.7"

GITLEAKS_VERSION="8.30.1"
GITLEAKS_LINUX_X64_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
