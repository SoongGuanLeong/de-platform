# The fixture manifest (docs/testing-strategy.md section 4).
#
# No fixture bytes are committed. Each entry names the source, the pinned
# generator, the checksum of the generated file, the declared volume and the
# reduction. A fixture may be reduced only when the evidence item labels the
# reduction and the claim is not volume-dependent.

version: 1

fixtures:
  - name: tpcc-w100
    source: >-
      TPC-C v5.11.0, https://www.tpc.org/tpc_documents_current_versions/pdf/tpc-c_v5.11.0.pdf.
      No official loader exists, so the population is generated by the platform's
      own driver (ingestion/src/de_ingestion/commerce/tpcc/population.py).
    generator: ingestion/src/de_ingestion/commerce/tpcc/population.py
    seed: 20261003
    checksum:
      algorithm: sha256
      value: null
      note: >-
        no fixture bytes are committed, so there is no file to checksum; the
        generator is pinned by the seed above and its determinism is asserted by
        ingestion/tests/test_tpcc_population.py
    declared_volume: >-
      W=100. The closed-form population model yields ORDER_LINE at about 30
      million rows (the dataset selection's own figure) and about 50 million
      rows across all nine tables, and about 10 GB in PostgreSQL
      (docs/dataset-selection.md section 7)
    reduced: >-
      W=10 is the declared correctness slice (docs/testing-strategy.md section
      4.1); W=1 is the default for the live integration suite
    volume_dependent: true
    owner: ingestion
    limitations:
      - >-
        The declared volume W=100 was not driven live on this host. The model is
        asserted at W=100 by ingestion/tests/test_tpcc_counts.py, and the live
        path was run at W=10. The test that closes the gap is
        tests/batch/test_tpcc_driver.py with TPCC_TEST_WAREHOUSES=100 under the
        batch profile on a tier-1 host.

  - name: onspd-may-2026-subset
    source: >-
      ONS Postcode Directory (May 2026), hosted table, ONS Geography.
      https://open-geography-portalx-ons.hub.arcgis.com/datasets/ons::ons-postcode-directory-may-2026
    generator: ingestion/scripts/fetch_onspd_fixture.py
    checksum:
      algorithm: sha256
      value: da821e03285994a9e63e5d6c352ac9bb09a83ae2925c6a5bfc70780e6699ecc3
    declared_volume: >-
      the full release is 235 MB, approximately 2.7 million postcodes and 137
      fields; the hosted table carries 54 of those fields
    reduced: >-
      a bounded subset of 920 rows across four documented queries: BT postcodes
      (to exercise the licence exclusion), terminated postcodes (the SCD2
      interval), straddling postcodes (the bridge's many-to-many) and plain live
      postcodes
    volume_dependent: false
    owner: ingestion
