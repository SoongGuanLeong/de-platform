# Declared thresholds for the de-platform completion bar.
#
# A budget is committed before the measurement it judges, and every evidence item
# cites the budget id it is judged against. The CI resolves each citation to the
# commit that introduced the budget, so the order is visible in git history.
# Changing a budget creates a new entry that names the entry it replaces in
# `supersedes`; evidence citing a superseded budget is invalid.
# See docs/completion-bar.md section 9 and docs/benchmark-plan.md section 6.
#
# A budget is a threshold, never a result. No measured number appears in this file.
#
# `commitment` declares how the value is committed, in one of two classes. Both
# satisfy the rule that a threshold precedes the measurement it judges.
#   fixed   - the threshold is a design constraint: an external limit, a declared
#             architectural target, or a mechanism that must work at all. The value
#             is committed with the entry.
#   derived - the threshold is relative and can only be set once the baseline arm
#             exists on this hardware. The derivation rule is committed with the
#             entry and the value lands in a commit that precedes the judged run.
#             Until then `threshold` is `pending`, and an evidence item citing a
#             pending entry fails CI.
#
# `declared_commit` names the commit that introduced the entry. A commit cannot
# name itself, so a new entry is committed with `declared_commit: pending-fill`
# and the follow-up commit writes the sha.

version: 2

budgets:
  # --- M1: the two component-swap drills, from docs/requirements-matrix.md ---
  - id: m1-catalog-swap-hours
    metric: Wall-clock hours to swap the Iceberg REST catalog from Polaris to Lakekeeper, including the diff required
    unit: hours
    threshold: 8
    direction: lower-is-better
    profile: batch
    commitment: fixed
    rationale: The portability claim is that a component swap is a same-day action rather than a migration project, so one working day is the ceiling. The swap is cheap only because no code path calls a Polaris-proprietary admin API, which is asserted separately.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m1-storage-swap-hours
    metric: Wall-clock hours to swap object storage from SeaweedFS to RustFS, including the diff required
    unit: hours
    threshold: 8
    direction: lower-is-better
    profile: batch
    commitment: fixed
    rationale: As above. The storage swap is the one that touches the data plane, so it is the more expensive of the two and the figure the eight hours is really testing.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  # --- M2: CDC correctness, from docs/requirements-matrix.md ---
  - id: m2-cdc-retention-window
    metric: Kafka topic retention for the CDC topics, expressed as a time window
    unit: hours
    threshold: 24
    direction: higher-is-better
    profile: streaming
    commitment: fixed
    rationale: ADR-0018 makes the CDC topics time-bounded, and M2's idempotence test replays a partition from offset 0, which needs the whole capture still present. Twenty-four hours covers a capture window plus the replay, and is the longest window the 5 to 10 GB topic size budget allows at the declared rate.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m2-replication-lag
    metric: Debezium MilliSecondsBehindSource, the lag between a committed source transaction and the event reaching Kafka
    unit: seconds
    threshold: 60
    direction: lower-is-better
    profile: streaming
    commitment: fixed
    rationale: Bounded lag is the difference between a replication slot that advances and one that stalls and holds WAL. Sixty seconds sits well inside the 24-hour retention window, so a stall is caught long before the window could drop unreplayed data.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  # --- M3: exactly-once effect and Flink tuning, from docs/requirements-matrix.md ---
  - id: m3-checkpoint-duration
    metric: Flink checkpoint duration
    unit: seconds
    threshold: 30
    direction: lower-is-better
    profile: streaming
    commitment: fixed
    rationale: The baseline checkpoint interval is 60 s (docs/streaming-jobs.md section 7). A checkpoint taking longer than half the interval leaves no headroom for a slow one, so 30 s is the pass condition the tuning record's interval arms are judged against.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m3-checkpoint-failed-count
    metric: Failed checkpoints over a benchmark run
    unit: checkpoints
    threshold: 0
    direction: lower-is-better
    profile: streaming
    commitment: fixed
    rationale: A failed checkpoint is a correctness event, not a performance one, so any failure invalidates the run rather than lowering a score. Counted over the whole run, never as a rate.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m3-equality-delete-files
    metric: Equality delete files present on a CDC table after the compaction step
    unit: files
    threshold: 1
    direction: lower-is-better
    profile: streaming
    commitment: fixed
    rationale: The claim is that compaction collapses the delete files rather than that it removes every one. One file is the floor for a table that took writes after the last compaction, and the count before and after is the measured quantity.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  # --- M4: Spark batch correctness, from docs/requirements-matrix.md ---
  - id: m4-cross-path-tolerance
    metric: Relative difference between the Flink and Spark values of the shared metric, for a sum; counts are asserted exactly
    unit: ratio
    threshold: 0.001
    direction: lower-is-better
    profile: batch
    commitment: fixed
    rationale: The two engines sum in different orders, so a float sum cannot agree bit for bit while a count can and does. One part in a thousand is tighter than the rounding the shared metric can carry, and the comparison is a CI validator reading two committed artifacts (docs/testing-strategy.md section 8).
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m4-batch-wallclock
    metric: Wall-clock seconds for the full bronze to silver to gold batch at the declared volume
    unit: seconds
    threshold: pending
    direction: lower-is-better
    profile: batch
    commitment: derived
    derivation: The value is the wall-clock of the declared baseline run at the declared volume, committed in a commit that precedes the run it judges. The rule is fixed here so the number is not free once the run happens.
    rationale: A batch wall-clock is a property of this hardware and this volume, so a number chosen before either was exercised would be a guess wearing a threshold's clothes (docs/serving-layer.md section 9).
    declared_on: 2026-09-29
    declared_commit: pending-fill

  # --- M5: physical table layout, from docs/requirements-matrix.md ---
  - id: m5-median-file-size
    metric: Median data-file size across a table after the load, per layout variant
    unit: bytes
    threshold: 67108864
    direction: higher-is-better
    profile: batch
    commitment: fixed
    rationale: The Iceberg sink targets 128 MiB files (docs/streaming-jobs.md section 7), so a healthy distribution's median sits at or above half the target. A median below 64 MiB is the small-file problem arriving through the batch path instead of the streaming one.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m5-small-file-share
    metric: Share of data files below 16 MiB, per layout variant
    unit: ratio
    threshold: 0.05
    direction: lower-is-better
    profile: batch
    commitment: fixed
    rationale: One eighth of the 128 MiB target. A higher share means compaction is not keeping pace with the write path, which is the mechanism incident 3 injects. The share is recorded at rest and again after compaction.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m5-write-throughput
    metric: Rows written per second into one layout variant's table during the bulk load
    unit: rows-per-second
    threshold: pending
    direction: higher-is-better
    profile: batch
    commitment: derived
    derivation: The value is the median write throughput of the declared baseline arm (variant A), committed in a commit that precedes the run it judges. The three variants are then judged against each other and against that baseline.
    rationale: Write throughput is a property of this hardware, this volume and this engine pin set, none of which has been exercised, so the baseline run is what makes the number meaningful.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m5-compaction-duration
    metric: Wall-clock seconds for one rewrite_data_files over a layout variant
    unit: seconds
    threshold: pending
    direction: lower-is-better
    profile: batch
    commitment: derived
    derivation: The value is the median compaction duration of the declared baseline arm (variant A) at the declared volume, committed in a commit that precedes the run it judges.
    rationale: Compaction cost is a function of file count and volume on this hardware, so it is baseline-relative by nature. The file counts before and after are the measured quantity; this threshold judges the cost of achieving them.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  # --- M6: dimensional modelling and expert SQL, from docs/requirements-matrix.md ---
  - id: m6-query-improvement-ratio
    metric: The rewritten query's p50 divided by the original query's p50, per rewritten query
    unit: ratio
    threshold: 2
    direction: higher-is-better
    profile: batch
    commitment: fixed
    rationale: A rewrite that does not at least halve the latency is not worth the SQL complexity it adds, and the before-measurement is the baseline arm of a comparison rather than a separate run. Three queries are rewritten, each carrying its own before and after.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  # --- M7: the serving layer, from docs/requirements-matrix.md ---
  - id: m7-serving-recovery
    metric: Time from interrupting the serving path mid-session to the documented recovery assertion passing
    unit: seconds
    threshold: 300
    direction: lower-is-better
    profile: batch
    commitment: fixed
    rationale: The documented recovery is a restart plus the readiness assertion, not a rebuild. Five minutes is the ceiling for a recovery an operator performs by hand while a session is open; a longer recovery means the documented procedure is missing a step.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m7-concurrent-degradation-p1
    metric: The p95 at concurrency 4 divided by the p95 at concurrency 1, for the commercial analyst's query set
    unit: ratio
    threshold: 2
    direction: lower-is-better
    profile: batch
    commitment: fixed
    rationale: Four times the load must not cost four times the latency, which would be linear scaling and would mean the layout is queueing rather than parallelising. Two is the ceiling for sub-linear degradation with ClickHouse at 8 vCPU in the benchmark profile.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m7-concurrent-degradation-p2
    metric: The p95 at concurrency 4 divided by the p95 at concurrency 1, for the network analyst's query set
    unit: ratio
    threshold: 2
    direction: lower-is-better
    profile: batch
    commitment: fixed
    rationale: As m7-concurrent-degradation-p1, for the network spine's shaped copy and rollup.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m7-concurrent-degradation-p3
    metric: The p95 at concurrency 4 divided by the p95 at concurrency 1, for the operations analyst's query set
    unit: ratio
    threshold: 2
    direction: lower-is-better
    profile: streaming
    commitment: fixed
    rationale: As m7-concurrent-degradation-p1, measured on the ReplacingMergeTree serving copy under the streaming profile. The degradation ratio is used here rather than a latency budget because the freshness effect is measured separately and must not confound it.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m7-arm-delta
    metric: The materialised arm's p95 divided by the read-through arm's p95, over the six batch queries
    unit: ratio
    threshold: pending
    direction: lower-is-better
    profile: batch
    commitment: derived
    derivation: The value is the materialised arm's p95 ratio against the read-through arm measured on the same pinned snapshot, committed in a commit that precedes the judged run. A value below 1 is what converts ADR-0003 from a preference into a measurement.
    rationale: The magnitude of the two-arm delta is unknown until it is measured, and it is the one figure the architecture decision rests on. Committing it in advance would be asserting the result the experiment exists to establish.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m7-c1-p50
    metric: Median latency of query C1, revenue by nation and part category, at concurrency 1
    unit: milliseconds
    threshold: pending
    direction: lower-is-better
    profile: batch
    commitment: derived
    derivation: The value is the median of the declared baseline arm for this query at the declared volume, committed in a commit that precedes the judged run. The p95 commitment for this query is its persona's class ceiling, m9-interactive-p95.
    rationale: A per-query threshold invented before the workload is measured on this hardware would be a guess wearing a threshold's clothes (docs/serving-layer.md section 9). The p50 is baseline-relative; the p95 is a design class.
    declared_on: 2026-09-29
    declared_commit: pending-fill

