# The fixture manifest (docs/testing-strategy.md section 4).
#
# No fixture bytes are committed. Each entry names the source, the pinned
# generator, the checksum of the generated file (or of the pinned generator
# archive where the generated data is too large to commit), the declared volume
# and the reduction. A fixture may be reduced only when the evidence item labels
# the reduction and the claim is not volume-dependent.

version: 1

fixtures:

  - name: tpch
    source: TPC-H v3.0.1 (dbgen 2.14.0 C source)
    generator: dbgen, built from source by de_batch.commerce.tpch.dbgen
    generator_url: >-
      https://codeload.github.com/electrum/tpch-dbgen/tar.gz/32f1c1b92d1664dba542e927d23d86ffa57aa253
    checksum:
      algorithm: sha256
      value: 01d8a4fa0fff4be83a9f43dbdc5a69f560d34f5ff0b4dbff1fc3a5320baf6318
    checksum_of: >-
      the pinned generator source archive, because the generated data is not
      committed and the generator is what a run must reproduce
    declared_volume: SF100
    reduced: >-
      SF1 is the correctness slice, run under the declared batch profile. The
      profile's SeaweedFS ceiling (256 MiB) carries it with the store's volume
      index on disk and a bounded Go heap (docs/local-development.md section
      11). SF100 is the Phase 3 declared volume
    volume_dependent: true
    phase_1_run_volume: SF1
    tables:
      - region
      - nation
      - part
      - supplier
      - partsupp
      - customer
      - orders
      - lineitem
    owner: batch
