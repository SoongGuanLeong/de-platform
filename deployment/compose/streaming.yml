# The streaming profile.
#
# PostgreSQL, SeaweedFS, Polaris, ClickHouse, Kafka, Debezium Connect,
# Flink and the RIPE Atlas collector, co-resident. ClickHouse carries
# 832 MiB rather than 1024 because the collector is a resident of this
# profile and the peak already equals the enforceable peak.
#
# The compose subset is the portable runtime subset of docs/completion-bar.md
# section 11: OCI images, ports, environment, volumes, healthcheck with
# start_period, restart, depends_on without condition, command, and
# deploy.resources.limits.{cpus,memory,pids} with nothing else under deploy. The
# platform uses cpus and memory; pids is permitted and unused.
# deployment/scripts/check-compose.sh enforces it, resolves every limit
# against deployment/budgets/profiles.yaml and fails when a peak does not
# match its parts.
#
# Every image is pinned by the digest of its multi-arch index. The reference
# is repeated verbatim in deployment/tools.lock, and check-compose.sh fails
# when the two disagree.
#
# Secrets are read-only files under runtime/ (gitignored), mounted at
# /run/secrets/<name>, per ADR-0028. They are bind mounts rather than the
# compose secrets mechanism because a compose secret's uid, gid and mode are
# ignored by podman-compose, which is the cost recorded in
# docs/security-model.md section 2.4.
name: de-platform-streaming

services:
  postgres:
    image: docker.io/library/postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    restart: "no"
    environment:
      POSTGRES_USER: deplatform
      POSTGRES_DB: deplatform
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../../runtime/secrets/postgres_superuser_password:/run/secrets/postgres_superuser_password:ro
      - ../../runtime/secrets/polaris_db_password:/run/secrets/polaris_db_password:ro
      - ./postgres/entrypoint.sh:/harness/entrypoint.sh:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    entrypoint: ["/bin/sh", "/harness/entrypoint.sh"]
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U deplatform"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 384M

  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    restart: "no"
    volumes:
      - seaweedfs-data:/data
      - ../../runtime/secrets/seaweedfs_s3_secret_key:/run/secrets/seaweedfs_s3_secret_key:ro
      - ./seaweedfs/entrypoint.sh:/harness/entrypoint.sh:ro
      - ./seaweedfs/s3-config.json.tmpl:/harness/s3-config.json.tmpl:ro
    entrypoint: ["/bin/sh", "/harness/entrypoint.sh"]
    ports:
      - "127.0.0.1:59333:9333"
      - "127.0.0.1:58888:8888"
      - "127.0.0.1:58333:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M

  polaris:
    image: docker.io/apache/polaris:1.7.0@sha256:3495f67f38cca33892a045f7dd3f46eb52387f0fd52d4145538a772fd8aedad7
    restart: "no"
    depends_on:
      - postgres
    environment:
      AWS_ACCESS_KEY_ID: deplatform
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://seaweedfs:8333
    volumes:
      - ../../runtime/secrets/polaris_db_password:/run/secrets/polaris_db_password:ro
      - ../../runtime/secrets/polaris_bootstrap_secret:/run/secrets/polaris_bootstrap_secret:ro
      - ../../runtime/secrets/seaweedfs_s3_secret_key:/run/secrets/seaweedfs_s3_secret_key:ro
      - ./polaris/entrypoint.sh:/harness/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/harness/entrypoint.sh"]
    ports:
      - "127.0.0.1:58181:8181"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:26.8.13.2@sha256:d3cdda9b2137852b20b96b1262b043dbedbe78c2b2c7063a3da60781a29e3463
    restart: "no"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/limits-832m.xml:/etc/clickhouse-server/config.d/limits.xml:ro
    ports:
      - "127.0.0.1:58123:8123"
      - "127.0.0.1:59000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8123/ping >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.75"
          memory: 832M

  kafka:
    image: docker.io/apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    restart: "no"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:59092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 15s
      retries: 40
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  debezium-connect:
    image: quay.io/debezium/connect:3.6.1@sha256:5a7d3ff04a3d3f2098330b3fb34a6bb6dd3d07de4e09c76b29da13bf6276332a
    restart: "no"
    depends_on:
      - kafka
    environment:
      BOOTSTRAP_SERVERS: "kafka:9092"
      GROUP_ID: "de-platform-connect"
      CONFIG_STORAGE_TOPIC: "de_platform_connect_configs"
      OFFSET_STORAGE_TOPIC: "de_platform_connect_offsets"
      STATUS_STORAGE_TOPIC: "de_platform_connect_statuses"
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KAFKA_HEAP_OPTS: "-Xmx384M -Xms384M"
    ports:
      - "127.0.0.1:58083:8083"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 640M

  flink-jobmanager:
    image: docker.io/apache/flink:2.1.3-java17@sha256:303377fd46400715e3d4f6feba4443b27e784c5203951dd50c181d36e3893b34
    restart: "no"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 640m
    ports:
      - "127.0.0.1:58081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8081/overview >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 640M

  flink-taskmanager:
    image: docker.io/apache/flink:2.1.3-java17@sha256:303377fd46400715e3d4f6feba4443b27e784c5203951dd50c181d36e3893b34
    restart: "no"
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 1280m
        taskmanager.numberOfTaskSlots: 2
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1280M

  ripe-collector:
    image: localhost/de-platform/ripe-collector:0.0.0
    restart: "no"
    ports:
      - "127.0.0.1:59100:9100"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M

  prometheus:
    image: docker.io/prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    restart: "no"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:59090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9090/-/healthy >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  grafana:
    image: docker.io/grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    restart: "no"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - ../../runtime/secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:53000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  alertmanager:
    image: docker.io/prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    restart: "no"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:59093:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9093/-/healthy >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  flink-client:
    image: docker.io/apache/flink:2.1.3-java17@sha256:303377fd46400715e3d4f6feba4443b27e784c5203951dd50c181d36e3893b34
    restart: "no"
    depends_on:
      - flink-jobmanager
    command:
      - flink
      - --version
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

volumes:
  alertmanager-data: {}
  clickhouse-data: {}
  grafana-data: {}
  kafka-data: {}
  postgres-data: {}
  prometheus-data: {}
  seaweedfs-data: {}
