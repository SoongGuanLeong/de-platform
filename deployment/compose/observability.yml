# The observability overlay.
#
# Prometheus, Grafana and Alertmanager without a path, for authoring a
# dashboard and for reading one. The same three services appear inside
# batch.yml and streaming.yml, because an alert firing on a path that is
# not running is not an alert.
#
# The compose subset is the portable runtime subset of docs/completion-bar.md
# section 11: OCI images, ports, environment, volumes, healthcheck with
# start_period, restart, depends_on without condition, command, and
# deploy.resources.limits.{cpus,memory,pids} with nothing else under deploy. The
# platform uses cpus and memory; pids is permitted and unused.
# deployment/scripts/check-compose.sh enforces it, resolves every limit
# against deployment/budgets/profiles.yaml and fails when a peak does not
# match its parts.
#
# Every image is pinned by the digest of its multi-arch index. The reference
# is repeated verbatim in deployment/tools.lock, and check-compose.sh fails
# when the two disagree.
#
# Secrets are read-only files under runtime/ (gitignored), mounted at
# /run/secrets/<name>, per ADR-0028. They are bind mounts rather than the
# compose secrets mechanism because a compose secret's uid, gid and mode are
# ignored by podman-compose, which is the cost recorded in
# docs/security-model.md section 2.4.
name: de-platform-observability

services:
  prometheus:
    image: docker.io/prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    restart: "no"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:59090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9090/-/healthy >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  grafana:
    image: docker.io/grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    restart: "no"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - ../../runtime/secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:53000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  alertmanager:
    image: docker.io/prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    restart: "no"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:59093:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9093/-/healthy >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

volumes:
  alertmanager-data: {}
  grafana-data: {}
  prometheus-data: {}
