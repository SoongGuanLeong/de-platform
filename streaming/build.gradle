// The streaming distributions' Java build.
//
// Engine pins follow the Iceberg connector matrix: Flink 2.1.3 is the newest
// patch of the newest minor Apache Iceberg 1.11.0 ships a connector for
// (docs/adr/0024-engine-pins-follow-the-iceberg-connector-matrix.md), and JDK 17
// is the JVM the local images pin.
//
// The wrapper is committed, so the CI java job runs the same Gradle the developer
// runs (docs/ci-cd-strategy.md section 9).

ext.flinkVersion = '2.1.3'
ext.junitVersion = '5.11.4'

allprojects {
    group = 'com.deplatform'
    version = '0.0.0'
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencies {
        implementation "org.apache.flink:flink-streaming-java:${flinkVersion}"

        testImplementation "org.apache.flink:flink-test-utils:${flinkVersion}"
        testImplementation "org.apache.flink:flink-runtime:${flinkVersion}:tests"
        testImplementation "org.apache.flink:flink-streaming-java:${flinkVersion}:tests"
        testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events 'failed', 'skipped'
            exceptionFormat = 'full'
        }
        // Flink's test harness reflects into the JDK internals, which the module
        // system closes by default. The set mirrors the opens Flink's own build
        // passes on JDK 17.
        jvmArgs = [
            '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
            '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens=java.base/java.io=ALL-UNNAMED',
            '--add-opens=java.base/java.net=ALL-UNNAMED',
            '--add-opens=java.base/java.nio=ALL-UNNAMED',
            '--add-opens=java.base/java.util=ALL-UNNAMED',
            '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
            '--add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED',
            '--add-opens=java.base/java.util.concurrent.locks=ALL-UNNAMED',
            '--add-opens=java.base/java.text=ALL-UNNAMED',
            '--add-opens=java.base/java.time=ALL-UNNAMED',
            '--add-opens=java.base/java.math=ALL-UNNAMED',
            '--add-opens=java.base/java.util.stream=ALL-UNNAMED',
            '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
        ]
    }
}
