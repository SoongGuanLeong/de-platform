[project]
name = "governance"
version = "0.0.0"
description = "The data-quality framework, the gate, retention and the validators."
requires-python = ">=3.12"
# pyyaml is declared rather than borrowed: the register and budget validator reads
# YAML, and a distribution that imports a package should not rely on it arriving
# transitively through the dev-only yamllint.
dependencies = ["platform", "pyyaml"]

[tool.uv.sources]
platform = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

# The import package carries the "de_" prefix because the repository root is a
# valid sys.path entry, and a top-level package named after the distribution
# would be shadowed by that distribution's directory at the repository root.
# The prefix applies uniformly to every distribution in the workspace.
[tool.uv.build-backend]
module-name = "de_governance"
