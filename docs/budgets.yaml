  # --- M8: near-real-time serving, from docs/requirements-matrix.md ---
  - id: m8-freshness-p99
    metric: Source commit timestamp to the row being visible in the materialised ClickHouse copy, p99
    unit: seconds
    threshold: 120
    direction: lower-is-better
    profile: streaming
    commitment: fixed
    rationale: The operations analyst's declared class is near-real-time, and two minutes is the band that class means. It is also the same figure as the consumer-lag budget, because a lag beyond the freshness band is already a user-visible failure rather than a metric to trend.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m8-freshness-p50
    metric: Source commit timestamp to the row being visible in the materialised ClickHouse copy, p50
    unit: seconds
    threshold: pending
    direction: lower-is-better
    profile: streaming
    commitment: derived
    derivation: The value is the median freshness of the declared baseline arm at the declared volume, committed in a commit that precedes the judged run. The read-through arm's freshness is recorded alongside as the baseline the materialised copy is traded against.
    rationale: Median freshness is a function of the checkpoint interval, the sink commit and this hardware, so it is baseline-relative. The p99 is the class commitment; the p50 is the magnitude.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  # --- M9: the analyst-facing latency classes, from docs/requirements-matrix.md ---
  - id: m9-interactive-p95
    metric: p95 query latency for the commercial analyst's class, over C1 to C3
    unit: milliseconds
    threshold: 1000
    direction: lower-is-better
    profile: batch
    commitment: fixed
    rationale: A latency class is a user-facing commitment rather than a measurement on this hardware, so it is fixed in advance. One second is what interactive means, because an analyst waiting longer than that stops asking the question. The per-query p50 budgets sit under it.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m9-dashboard-p95
    metric: p95 query latency for the network analyst's class, over N1 to N3
    unit: milliseconds
    threshold: 5000
    direction: lower-is-better
    profile: batch
    commitment: fixed
    rationale: A dashboard refresh is read at a glance and is allowed to be slower than an interactive query, but not slow enough to be stale on arrival. Five seconds is the ceiling for that class.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m9-near-realtime-query-p95
    metric: p95 query latency for the operations analyst's class, over O1 to O3
    unit: milliseconds
    threshold: 10000
    direction: lower-is-better
    profile: streaming
    commitment: fixed
    rationale: The operations analyst reads live state and is the only persona whose queries touch a continuously written table, so the class is the loosest of the three. Ten seconds is the ceiling, and the freshness p99 is measured separately so the two effects never confound each other.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  # --- M10: access control, from docs/requirements-matrix.md ---
  - id: m10-session-policy-size
    metric: Bytes in the STS session policy Polaris generates for a vend for one table
    unit: bytes
    threshold: 2048
    direction: lower-is-better
    profile: batch
    commitment: fixed
    rationale: The limit is AWS's, not ours. A session policy above 2048 bytes is rejected or silently truncated, and a truncated policy widens the vended prefix. The assertion is that the generated policy stays inside it, which is what keeps the prefix-scoped credential a real boundary.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  # --- M12: retention, from docs/requirements-matrix.md ---
  - id: m12-storage-reclaimed
    metric: Bytes reclaimed by expire_snapshots over a table with expired snapshots present
    unit: bytes
    threshold: 1
    direction: higher-is-better
    profile: batch
    commitment: fixed
    rationale: Zero bytes reclaimed means the expiry did not run. The threshold is one byte because the claim is that the mechanism reclaims at all; the magnitude is a measurement, not a target. Shared with M5's retention policy, which is the same number judged by the same run.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  # --- M13: data quality, from docs/requirements-matrix.md ---
  - id: m13-false-positive-rate
    metric: Fault-detection checks firing on a clean run, over 20 consecutive clean runs
    unit: false-positives
    threshold: 0
    direction: lower-is-better
    profile: batch
    commitment: fixed
    rationale: A check that fires on clean data is broken, and the rate counts fault-detection checks only, with source-hazard checks excluded by design (docs/governance-and-data-quality.md). Zero over twenty runs is the only defensible value; a non-zero rate means the check needs fixing, not budgeting.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m13-quarantine-share
    metric: Quarantined rows as a share of rows evaluated in one run
    unit: ratio
    threshold: 0.01
    direction: lower-is-better
    profile: batch
    commitment: fixed
    rationale: Quarantine diverts and continues, so a small share is normal because ONSPD and RIPE Atlas carry genuine publisher defects. Above one percent the source has changed shape, and the declared escalation from quarantine to fail is what stops a silent drift reaching gold.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  # --- M15: monitoring and alerting, from docs/requirements-matrix.md ---
  - id: m15-lag-budget
    metric: Consumer lag on the RIPE Atlas topic, expressed as seconds of production at the declared rate
    unit: seconds
    threshold: 120
    direction: lower-is-better
    profile: streaming
    commitment: fixed
    rationale: The alert rule is on records-lag-max, and a lag expressed in records is meaningless without the rate, so the budget is stated in time. Two minutes is the freshness band the operations analyst is promised, and it is far inside the 24-hour CDC retention window, so the alert fires long before retention could drop unreplayed data. This is also incident 1's detection link.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  # --- M16: incident root-cause analysis, from docs/requirements-matrix.md ---
  # MTTD ends at the alert delivery timestamp at the real destination, not at
  # Alertmanager firing. MTTR is from delivery to the recovery assertion passing.
  - id: m16-mttd-incident-1
    metric: Minutes from the injection timestamp to the alert delivery timestamp, Kafka consumer lag spike
    unit: seconds
    threshold: 300
    direction: lower-is-better
    profile: streaming
    commitment: fixed
    rationale: The alerting pipeline is the same for every injected incident (15 s scrape, 1 m evaluation, Alertmanager group_wait), so the ceiling is one figure for all six. Five minutes is generous for that pipeline and still far inside an operator's attention span.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m16-mttd-incident-2
    metric: Minutes from the injection timestamp to the alert delivery timestamp, Flink checkpoint timeout
    unit: seconds
    threshold: 300
    direction: lower-is-better
    profile: streaming
    commitment: fixed
    rationale: As m16-mttd-incident-1.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m16-mttd-incident-3
    metric: Minutes from the injection timestamp to the alert delivery timestamp, Iceberg small-file explosion
    unit: seconds
    threshold: 300
    direction: lower-is-better
    profile: streaming
    commitment: fixed
    rationale: As m16-mttd-incident-1. This one is detected on the compaction backlog rather than on a path-level error, so the same ceiling is the harder claim of the three.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m16-mttd-incident-4
    metric: Minutes from the injection timestamp to the alert delivery timestamp, ClickHouse query regression
    unit: seconds
    threshold: 300
    direction: lower-is-better
    profile: batch
    commitment: fixed
    rationale: As m16-mttd-incident-1.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m16-mttd-incident-5
    metric: Minutes from the injection timestamp to the alert delivery timestamp, object-storage outage
    unit: seconds
    threshold: 300
    direction: lower-is-better
    profile: batch
    commitment: fixed
    rationale: As m16-mttd-incident-1. Detection is fast even though recovery is slow, and keeping the two figures separate is the point of measuring both.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m16-mttd-incident-6
    metric: Minutes from the trigger timestamp to the alert delivery timestamp, RIPE Atlas source hazard
    unit: seconds
    threshold: 300
    direction: lower-is-better
    profile: streaming
    commitment: fixed
    rationale: As m16-mttd-incident-1. Incident 6 is a source hazard rather than an injected fault, so it carries a trigger timestamp instead of an injection timestamp, and the same delivery ceiling applies.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m16-mttr-incident-1
    metric: Minutes from the alert delivery timestamp to the recovery assertion passing, Kafka consumer lag spike
    unit: seconds
    threshold: 1800
    direction: lower-is-better
    profile: streaming
    commitment: fixed
    rationale: Recovery is a committed durable change with a SHA plus the backlog draining, never a restart. Thirty minutes is the ceiling for a change an operator writes and applies while the platform is degraded.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m16-mttr-incident-2
    metric: Minutes from the alert delivery timestamp to the recovery assertion passing, Flink checkpoint timeout
    unit: seconds
    threshold: 1800
    direction: lower-is-better
    profile: streaming
    commitment: fixed
    rationale: As m16-mttr-incident-1. The permanent fix is an Iceberg table-property change bounding commit size, not a Flink parameter change.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m16-mttr-incident-3
    metric: Minutes from the alert delivery timestamp to the recovery assertion passing, Iceberg small-file explosion
    unit: seconds
    threshold: 1800
    direction: lower-is-better
    profile: batch
    commitment: fixed
    rationale: As m16-mttr-incident-1. Recovery includes the compaction run that collapses the file count, which is why the figure is a run to completion rather than a restart.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m16-mttr-incident-4
    metric: Minutes from the alert delivery timestamp to the recovery assertion passing, ClickHouse query regression
    unit: seconds
    threshold: 1800
    direction: lower-is-better
    profile: batch
    commitment: fixed
    rationale: As m16-mttr-incident-1. The fix is a layout change rather than a query rewrite, so recovery includes re-materialising the affected partition.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m16-mttr-incident-5
    metric: Minutes from the alert delivery timestamp to the recovery assertion passing, object-storage outage
    unit: seconds
    threshold: 3600
    direction: lower-is-better
    profile: batch
    commitment: fixed
    rationale: The one incident whose recovery is bounded by the backlog that accumulated while the data plane was down, not by the fix itself. One hour is the ceiling, and the materialised ClickHouse copies surviving the outage is the behaviour worth demonstrating rather than the speed of the restart.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m16-mttr-incident-6
    metric: Minutes from the alert delivery timestamp to the recovery assertion passing, RIPE Atlas source hazard
    unit: seconds
    threshold: 3600
    direction: lower-is-better
    profile: streaming
    commitment: fixed
    rationale: A publisher-side hazard cannot be fixed by the platform, so recovery means the declared mitigation and the correctness assertion, which takes longer than an injected fault the platform controls.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  # --- M17: operating an open table format, from docs/data-contracts.md section 8 ---
  # Declared before the schema-evolution matrix is run. The numbers these budgets
  # judge are produced during implementation, never here.
  - id: m17-commit-latency
    metric: Wall-clock elapsed for one schema-change ALTER, MERGE or rollback operation
    unit: seconds
    threshold: 30
    direction: lower-is-better
    profile: benchmark
    commitment: fixed
    rationale: A schema change or rollback is a maintenance action, so it should stay under the interactive threshold at the benchmark profile's data volume. One budget covers all three operations because the metric is the same and the operations are compared against each other.
    declared_on: 2026-09-28
    declared_commit: b076796

  - id: m17-metadata-object-growth
    metric: Metadata objects and rows added in the snapshots, manifests and files tables by one operation
    unit: objects
    threshold: 6
    direction: lower-is-better
    profile: benchmark
    commitment: fixed
    rationale: One operation adds a bounded set of metadata objects (a snapshot, its manifest list, and the data and delete manifests it references), so the budget is a small constant rather than a proportion. The count is recorded, and is never presented as byte growth.
    declared_on: 2026-09-28
    declared_commit: b076796

  - id: m17-metadata-byte-growth
    metric: Metadata bytes added by one operation, where measurable
    unit: bytes
    threshold: 1048576
    direction: lower-is-better
    profile: benchmark
    commitment: fixed
    rationale: Metadata must not grow faster than the data it describes. One mebibyte per operation is the ceiling at the benchmark profile's data volume, and it is recorded separately from the object count because a few large manifests and many small ones are different problems.
    declared_on: 2026-09-28
    declared_commit: b076796

  - id: m17-expire-snapshots-removed
    metric: Snapshots, references and files removed by expire_snapshots, with in-window snapshots retained
    unit: snapshots
    threshold: 1
    direction: higher-is-better
    profile: benchmark
    commitment: fixed
    rationale: The operation must remove at least the deliberately expired snapshot. The retention half of the assertion, that an in-window snapshot survives, belongs to M12 and is recorded alongside; this budget covers only the cost counter.
    declared_on: 2026-09-28
    declared_commit: b076796

  - id: m17-orphan-cleanup-bytes
    metric: Orphan files removed and bytes reclaimed by remove_orphan_files, measured separately from snapshot expiry
    unit: bytes
    threshold: 1
    direction: higher-is-better
    profile: benchmark
    commitment: fixed
    rationale: A deliberately interrupted write leaves orphan files, and zero bytes reclaimed means the cleanup did not run. The threshold is one byte because the claim is that the mechanism reclaims at all; the magnitude is a measurement, not a target.
    declared_on: 2026-09-28
    declared_commit: b076796

  # --- M18: cost at scale, from docs/cloud-architecture.md section 6.5 ---
  # The measured axis is cost per GB ingested: objects written, bytes written and
  # compaction work per GB of CDC ingested. Chosen in ADR-0027 because S3 request
  # cost and compaction compute dominate a lakehouse bill at 10x and neither is a
  # function of stored bytes. Every other cost conclusion is an extrapolation.
  - id: m18-objects-per-gb
    metric: Metadata and data objects written per GB of CDC ingested
    unit: objects-per-gb
    threshold: pending
    direction: lower-is-better
    profile: streaming
    commitment: derived
    derivation: The value is the median of the declared baseline run at the declared volume, committed in a commit that precedes the judged run.
    rationale: Objects per GB is the counter that feeds S3 request cost, which is the line that bends superlinearly with ingest rate. It is a property of the sink's file sizing on this hardware, so it is baseline-relative.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m18-bytes-per-gb
    metric: Bytes written to Iceberg per GB of CDC ingested
    unit: bytes-per-gb
    threshold: pending
    direction: lower-is-better
    profile: streaming
    commitment: derived
    derivation: The value is the median of the declared baseline run at the declared volume, committed in a commit that precedes the judged run.
    rationale: The write amplification between the source's bytes and the stored bytes, including delete files and metadata. Measured rather than assumed, because it is the multiplier every storage-cost extrapolation is built on.
    declared_on: 2026-09-29
    declared_commit: pending-fill

  - id: m18-compaction-work-per-gb
    metric: Compute spent on compaction per GB of CDC ingested
    unit: cpu-seconds-per-gb
    threshold: pending
    direction: lower-is-better
    profile: streaming
    commitment: derived
    derivation: The value is the median of the declared baseline run's compaction step at the declared volume, committed in a commit that precedes the judged run.
    rationale: Compaction compute is the second line that dominates a lakehouse bill at 10x, and it grows with file count rather than with bytes. It is the one cost the platform produces itself rather than inheriting from a price list.
    declared_on: 2026-09-29
    declared_commit: pending-fill
