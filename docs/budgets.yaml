# Declared thresholds for the de-platform completion bar.
#
# A budget is committed before the measurement it judges, and every evidence item
# cites the budget id it is judged against. The CI resolves each citation to the
# commit that introduced the budget, so the order is visible in git history.
# Changing a budget creates a new entry; evidence citing a superseded budget is
# invalid. See docs/completion-bar.md section 9.
#
# A budget is a threshold, never a result. No measured number appears in this file.

version: 1

# budgets:
#   - id: <stable identifier>
#     metric: <what is measured>
#     unit: <the unit>
#     threshold: <the declared threshold>
#     direction: lower-is-better | higher-is-better
#     profile: smoke | batch | streaming | observability | benchmark
#     rationale: <why this threshold and not another>
#     declared_on: <ISO date>
#     declared_commit: <the commit sha that introduced this entry>
budgets:
  # M17's per-operation cost counters, from docs/data-contracts.md section 8.
  # Declared before the schema-evolution matrix is run. The numbers these budgets
  # judge are produced during implementation, never here.
  - id: m17-commit-latency
    metric: Wall-clock elapsed for one schema-change ALTER, MERGE or rollback operation
    unit: seconds
    threshold: 30
    direction: lower-is-better
    profile: benchmark
    rationale: A schema change or rollback is a maintenance action, so it should stay under the interactive threshold at the benchmark profile's data volume. One budget covers all three operations because the metric is the same and the operations are compared against each other.
    declared_on: 2026-09-28
    declared_commit: pending

  - id: m17-metadata-object-growth
    metric: Metadata objects and rows added in the snapshots, manifests and files tables by one operation
    unit: objects
    threshold: 6
    direction: lower-is-better
    profile: benchmark
    rationale: One operation adds a bounded set of metadata objects (a snapshot, its manifest list, and the data and delete manifests it references), so the budget is a small constant rather than a proportion. The count is recorded, and is never presented as byte growth.
    declared_on: 2026-09-28
    declared_commit: pending

  - id: m17-metadata-byte-growth
    metric: Metadata bytes added by one operation, where measurable
    unit: bytes
    threshold: 1048576
    direction: lower-is-better
    profile: benchmark
    rationale: Metadata must not grow faster than the data it describes. One mebibyte per operation is the ceiling at the benchmark profile's data volume, and it is recorded separately from the object count because a few large manifests and many small ones are different problems.
    declared_on: 2026-09-28
    declared_commit: pending

  - id: m17-expire-snapshots-removed
    metric: Snapshots, references and files removed by expire_snapshots, with in-window snapshots retained
    unit: snapshots
    threshold: 1
    direction: higher-is-better
    profile: benchmark
    rationale: The operation must remove at least the deliberately expired snapshot. The retention half of the assertion, that an in-window snapshot survives, belongs to M12 and is recorded alongside; this budget covers only the cost counter.
    declared_on: 2026-09-28
    declared_commit: pending

  - id: m17-orphan-cleanup-bytes
    metric: Orphan files removed and bytes reclaimed by remove_orphan_files, measured separately from snapshot expiry
    unit: bytes
    threshold: 1
    direction: higher-is-better
    profile: benchmark
    rationale: A deliberately interrupted write leaves orphan files, and zero bytes reclaimed means the cleanup did not run. The threshold is one byte because the claim is that the mechanism reclaims at all; the magnitude is a measurement, not a target.
    declared_on: 2026-09-28
    declared_commit: pending
