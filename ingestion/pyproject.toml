[project]
name = "ingestion"
version = "0.0.0"
description = "Ingestion for both spines: the Debezium connector, the OLTP DDL and load, the RIPE Atlas collector and the ONSPD loader."
requires-python = ">=3.12"
# psycopg 3 is the PostgreSQL client the TPC-C driver writes through. It is
# chosen over asyncpg (an async driver, while the driver is synchronous) and
# pg8000 (pure Python, but without the COPY protocol support the bulk load
# needs). The [binary] extra pulls a wheel so no compiler is needed. uv.lock
# pins the resolved version; the reconsideration trigger is a PostgreSQL major
# that psycopg 3 does not support.
#
# websockets and kafka-python are the RIPE Atlas collector's runtime
# dependencies, pinned like every other toolchain version
# (docs/ci-cd-strategy.md section 9). websockets is the live stream client;
# kafka-python is the producer both the live subscription and the REST backfill
# write through, so the backfill is a producer into the same topic rather than a
# second writer (ADR-0014).
dependencies = [
    "platform",
    "governance",
    "psycopg[binary]",
    "websockets==15.0.1",
    "kafka-python==3.0.11",
]

[tool.uv.sources]
platform = { workspace = true }
governance = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

# The import package carries the "de_" prefix because the repository root is a
# valid sys.path entry, and a top-level package named after the distribution
# would be shadowed by that distribution's directory at the repository root.
# The prefix applies uniformly to every distribution in the workspace.
[tool.uv.build-backend]
module-name = "de_ingestion"
