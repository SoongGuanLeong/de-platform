# The fixture manifest (docs/testing-strategy.md section 4).
#
# No fixture bytes are committed. Each entry names the source, the pinned
# generator, the checksum of the generated file (or of the pinned generator
# archive where the generated data is too large to commit), the declared volume
# and the reduction. A fixture may be reduced only when the evidence item labels
# the reduction and the claim is not volume-dependent.

version: 1

fixtures:
  - name: onspd-may-2026-subset
    source: >-
      ONS Postcode Directory (May 2026), hosted table, ONS Geography.
      https://open-geography-portalx-ons.hub.arcgis.com/datasets/ons::ons-postcode-directory-may-2026
    generator: ingestion/scripts/fetch_onspd_fixture.py
    checksum:
      algorithm: sha256
      value: da821e03285994a9e63e5d6c352ac9bb09a83ae2925c6a5bfc70780e6699ecc3
    declared_volume: >-
      the full release is 235 MB, approximately 2.7 million postcodes and 137
      fields; the hosted table carries 54 of those fields
    reduced: >-
      a bounded subset of 920 rows across four documented queries: BT postcodes
      (to exercise the licence exclusion), terminated postcodes (the SCD2
      interval), straddling postcodes (the bridge's many-to-many) and plain live
      postcodes
    volume_dependent: false
    owner: ingestion

  - name: tpch
    source: TPC-H v3.0.1 (dbgen 2.14.0 C source)
    generator: dbgen, built from source by de_batch.commerce.tpch.dbgen
    generator_url: >-
      https://codeload.github.com/electrum/tpch-dbgen/tar.gz/32f1c1b92d1664dba542e927d23d86ffa57aa253
    checksum:
      algorithm: sha256
      value: 01d8a4fa0fff4be83a9f43dbdc5a69f560d34f5ff0b4dbff1fc3a5320baf6318
    checksum_of: >-
      the pinned generator source archive, because the generated data is not
      committed and the generator is what a run must reproduce
    declared_volume: SF100
    reduced: >-
      SF1 is the correctness slice; the Phase 1 bronze load is carried out at
      SF10, the volume the run window held (docs/implementation-roadmap.md
      section 8)
    volume_dependent: true
    phase_1_run_volume: SF10
    tables:
      - region
      - nation
      - part
      - supplier
      - partsupp
      - customer
      - orders
      - lineitem
    owner: batch
